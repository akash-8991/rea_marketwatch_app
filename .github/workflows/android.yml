name: Android app

# Builds the MarketLens Android app (an .apk you can install on a phone).
#   - every push/PR that touches mobile/ or the shared web UI: run the engine tests
#   - push to branch `mobile-app`, a tag `mobile-v*`, or a manual run: also build the APK
#   - tag `mobile-v*`: attach the APK and its checksum to a GitHub Release
on:
  push:
    branches: [main, mobile-app]
    tags: ['mobile-v*']
    paths: ['mobile/**', 'ui/**', 'src/marketlens/static/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'ui/**', 'src/marketlens/static/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - name: Built UI files are up to date (Tailwind CSS and Lucide icons are generated; a stale commit fails here)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../src/marketlens/static/css/tailwind.css ../src/marketlens/static/js/icons.js
      - name: JavaScript engine tests (golden outputs from the Python engine + end-to-end with a fake NSE server)
        working-directory: mobile
        run: node --test

  apk:
    needs: engine-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # the build runs npm and Gradle install scripts: it gets no write access and no stored git credentials (publishing is the separate job below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: '3.12' }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install tooling
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          python -m pip install pillow
      - name: Build the web bundle and create the Android project
        working-directory: mobile
        run: |
          node scripts/build-www.mjs
          npx cap add android
          python scripts/prepare-android.py --version-code "${{ github.run_number }}"
          npx cap sync android
      - name: Signing key
        # The same key as before when the secret exists, so phones can update in place. Without it a one-off key is generated for this build (installing it over an older build then needs an uninstall first).
        # Optional stronger secrets: MARKETLENS_KEYSTORE_PASSWORD, MARKETLENS_KEY_ALIAS, MARKETLENS_KEY_PASSWORD (default: the debug-key values the existing keystore uses).
        env:
          KEYSTORE_B64: ${{ secrets.MARKETLENS_DEBUG_KEYSTORE }}
          STORE_PW: ${{ secrets.MARKETLENS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARKETLENS_KEY_ALIAS }}
          KEY_PW: ${{ secrets.MARKETLENS_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/marketlens.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STORE_PW="${STORE_PW:-android}"; KEY_ALIAS="${KEY_ALIAS:-androiddebugkey}"; KEY_PW="${KEY_PW:-android}"
            echo "Using the configured keystore"
          else
            echo "::warning::No MARKETLENS_DEBUG_KEYSTORE secret: this APK gets a one-off key, so installing a later build over it will require uninstalling first."
            STORE_PW="$(openssl rand -hex 16)"; KEY_ALIAS=marketlens; KEY_PW="$STORE_PW"
            keytool -genkeypair -keystore "$KS" -storepass "$STORE_PW" -keypass "$KEY_PW" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MarketLens one-off build"
          fi
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
          echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=$KS -Pandroid.injected.signing.store.password=$STORE_PW -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PW" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS" -storepass "$STORE_PW" | grep -i "fingerprint" || true
      - name: Build the release APK (not debuggable)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease $SIGN_ARGS
      - name: Name, checksum and inspect the APK
        id: pack
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="MarketLens-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -l "$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}aapt2" dump badging "$OUT" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)" || true
          if "${BT}aapt2" dump badging "$OUT" | grep -q "application-debuggable"; then echo "::error::The APK is debuggable"; exit 1; fi
          echo "Not debuggable: ok"
          echo "Signer certificate:"
          "${BT}apksigner" verify --print-certs "$OUT" | grep -E "SHA-256|Verified" || true
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MarketLens-android
          path: |
            mobile/${{ steps.pack.outputs.apk }}
            mobile/${{ steps.pack.outputs.apk }}.sha256
          if-no-files-found: error

  publish:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the only job that can push to main and create the release; it runs no install scripts, only copies the checked artefact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: main }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: MarketLens-android, path: apk }
      - name: Commit the APK to main for direct download
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          APK=$(ls apk/MarketLens-*-android.apk | head -1)
          (cd apk && sha256sum -c "$(basename "$APK").sha256")
          mkdir -p downloads/checksums
          cp "$APK" downloads/MarketLens-android.apk
          (cd downloads && sha256sum MarketLens-android.apk > checksums/MarketLens-android.apk.sha256)
          git add downloads
          git commit -m "Android app ${GITHUB_REF_NAME#mobile-v}: update downloads/MarketLens-android.apk" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "MarketLens for Android ${GITHUB_REF_NAME#mobile-v}" \
            --notes "Release-signed APK (not debuggable) for sideloading. Install steps and limits: docs/MOBILE.md. Checksum: downloads/checksums/ in the repository." \
            apk/MarketLens-*-android.apk apk/MarketLens-*-android.apk.sha256
