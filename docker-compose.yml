# docker compose up -d   ->   open http://127.0.0.1:8080
services:
  marketlens:
    image: ghcr.io/akash-8991/rea_marketwatch_app:latest
    # build: .            # uncomment to build from this checkout instead of pulling
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # local only: the app speaks plain HTTP
    volumes:
      - marketlens-data:/data   # accounts, option data, audit log, cached snapshots
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  marketlens-data:
