[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.10.2"
description = "Local NSE markets dashboard: prices, screener with technical, sentiment and income views, live news, option chain."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []   # standard library only
keywords = ["nse", "stocks", "screener", "dashboard", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Office/Business :: Financial",
]

[project.scripts]
marketlens = "marketlens.cli:main"
marketlens-options-mcp = "marketlens.options_mcp:main"

[project.gui-scripts]
marketlens-desktop = "marketlens.desktop:main"

[project.optional-dependencies]
desktop = ["pywebview>=5"]   # a native window; without it the desktop app uses Chrome/Edge in app mode

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketlens = ["static/*.html", "static/css/*", "static/js/*", "data/*.csv"]
