<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MarketLens</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="modulepreload" href="js/lib.js">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="top">
    <div class="bar">
      <button id="menu" class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><span data-icon="menu"></span></button>
      <a class="logo" href="#/" aria-label="MarketLens home">Market<span>Lens</span></a>
      <div class="search" role="search">
        <label class="sr-only" for="q">Search NSE stocks by symbol or company name</label>
        <span class="search-ico" aria-hidden="true" data-icon="search"></span>
        <input id="q" type="search" placeholder="Search stocks" autocomplete="off" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
        <kbd class="kbd" aria-hidden="true">Ctrl K</kbd>
      </div>
      <span id="status-pill" class="pill" role="status" aria-live="polite"></span>
      <span id="whoami" class="whoami hide"></span><button id="logout" class="btn small hide" type="button">Sign out</button>
      <button id="theme" class="icon-btn spacer" type="button" aria-label="Toggle dark mode"><span data-icon="moon"></span></button>
    </div>
  </header>
  <div class="shell">
    <nav class="main" id="nav" aria-label="Main" data-open="false">
      <a href="#/" data-r="home"><span data-icon="layout-dashboard"></span>Home</a>
      <a href="#/markets" data-r="markets"><span data-icon="chart-line"></span>Markets</a>
      <a href="#/screener" data-r="screener"><span data-icon="list-filter"></span>Screener</a>
      <a href="#/options" data-r="options"><span data-icon="layers"></span>Option chain</a>
      <a href="#/watchlist" data-r="watchlist"><span data-icon="star"></span>Watchlist</a>
      <a href="#/paper" data-r="paper"><span data-icon="flask-conical"></span>Paper trading</a>
      <a href="#/news" data-r="news"><span data-icon="newspaper"></span>News</a>
      <a href="#/updates" data-r="updates"><span data-icon="activity"></span>Updates</a>
    </nav>
    <div class="content">
      <div id="banner" class="banner" role="status" aria-live="polite">Loading market data…</div>
      <main id="app" class="container" tabindex="-1"></main>
      <footer>This is an educational app. Nothing shown here is investment advice.</footer>
    </div>
  </div>
  <div id="toasts" class="toasts" role="region" aria-label="Notifications"></div>
  <script type="module" src="js/data.js"></script>
</body>
</html>
