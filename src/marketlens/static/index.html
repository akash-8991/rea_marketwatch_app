<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MarketLens</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/lib.js">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="top">
    <div class="bar container container--wide">
      <a class="logo" href="#/" aria-label="MarketLens home">Market<span>Lens</span></a>
      <div class="search" role="search">
        <label class="sr-only" for="q">Search NSE symbols</label>
        <input id="q" type="search" placeholder="Search NSE symbols" autocomplete="off" aria-controls="suggest">
        <div id="suggest" class="hide" aria-live="polite"></div>
      </div>
      <span id="whoami" class="whoami hide"></span><button id="logout" class="btn small hide" type="button">Sign out</button>
      <button id="theme" class="icon-btn spacer" type="button" aria-label="Toggle dark mode"><svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button id="menu" class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    </div>
    <nav class="main container container--wide" id="nav" aria-label="Main" data-open="false">
      <a href="#/" data-r="home">Home</a>
      <a href="#/markets" data-r="markets">Markets</a>
      <a href="#/screener" data-r="screener">Screener</a>
      <a href="#/options" data-r="options">Option chain</a>
      <a href="#/news" data-r="news">News</a>
      <a href="#/updates" data-r="updates">Updates</a>
      <a href="#/watchlist" data-r="watchlist">Watchlist</a>
    </nav>
  </header>
  <div id="banner" class="banner container container--wide" role="status" aria-live="polite">Loading market data…</div>
  <main id="app" class="container" tabindex="-1"></main>
  <footer>This is an educational app. Nothing shown here is investment advice.</footer>
  <script type="module" src="js/data.js"></script>
</body>
</html>
